name: onco_pharma_analytics

x-airflow-common: &airflow-common
# Reusable configuration block 
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  image: onco-pharma-airflow:3.1.0
  restart: unless-stopped
  env_file:
    - .env
  environment: &airflow-env
    AIRFLOW_HOME: /opt/airflow
    PYTHONPATH: /opt/airflow

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/airflow
    
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET} #Secret key used by Apache Airflow 3 to sign and verify JSON Web Tokens (JWTs).
    
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    # One task at a time
    AIRFLOW__CORE__PARALLELISM: "1"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"

    # DAG parsing per process
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "300"
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
    AIRFLOW__DAG_PROCESSOR__DAG_FILE_PROCESSOR_TIMEOUT: "180"

    #One worker for API requests
    AIRFLOW__API__WORKERS: "1"

    # To limit Database connections
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: "5"
    AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: "5"
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_TIMEOUT: "60"
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: "1800"

    #Indian Timezone
    TZ: Asia/Kolkata
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Kolkata
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Kolkata

    DBT_PROJECT_DIR: /opt/airflow/data_transformation/onco_pharma_analytics_dbt
    DBT_PROFILES_DIR: /opt/airflow/data_transformation/onco_pharma_analytics_dbt
  
  volumes: &airflow-volumes
    # To reflect local code changes in the container
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/include:/opt/airflow/include

    # DockerOperator requires Docker daemon access; security-sensitive.
    - /var/run/docker.sock:/var/run/docker.sock

    # CSV files read-only access
    - ./source_data:/opt/airflow/source_data:ro

    # Python ingestion modules
    - ./data_ingestion:/opt/airflow/data_ingestion
    #- ./utils:/opt/airflow/utils
    - ./data_transformation:/opt/airflow/data_transformation

    # To Check API server response
    - airflow_metadata:/opt/airflow/metadata
  networks:
    - onco_pharma_analytics_network
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: onco_pharma_postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=32MB"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onco_pharma_analytics_network

  airflow-init:
    <<: *airflow-common
    restart: "no"
    command: ["airflow", "db", "migrate"]

  airflow-api:
    <<: *airflow-common
    container_name: onco_pharma_airflow_api
    command: ["airflow", "api-server"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=10)\""]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  airflow-scheduler:
    <<: *airflow-common
    container_name: onco_pharma_airflow_scheduler
    command: ["airflow", "scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-api:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    container_name: onco_pharma_airflow_dag_processor
    command: ["airflow", "dag-processor"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-api:
        condition: service_healthy

  dbt:
    profiles: ["transformation"]
    build:
      context: .
      dockerfile: docker/Dockerfile.dbt
    image: onco-pharma-dbt:latest
    env_file:
      - .env
    environment:
      DBT_PROJECT_DIR: /app/dbt
      DBT_PROFILES_DIR: /app/dbt
    working_dir: /app/dbt

    volumes:
      - ./data_transformation/onco_pharma_analytics_dbt:/app/dbt
    networks:
      - onco_pharma_analytics_network
    restart: "no"

networks:
  onco_pharma_analytics_network:

volumes:
  airflow_metadata:
  postgres_data:
