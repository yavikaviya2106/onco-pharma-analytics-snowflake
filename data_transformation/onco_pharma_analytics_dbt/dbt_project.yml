
# Name of the project.
name: 'onco_pharma_analytics_dbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'onco_pharma_analytics_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

flags:
  fail_fast: true

models:
  onco_pharma_analytics_dbt:
    landing:
      +materialized: view

    staging:
      +materialized: view

    dimension:
      +materialized: table

    fact:
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: fail

    intermediate_data:
      +materialized: view

    intermediate_kpi:
      +materialized: table

    aggregate:
      +materialized: table

snapshots:
  onco_pharma_analytics_dbt:
    +schema: snapshots